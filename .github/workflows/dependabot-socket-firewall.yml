name: Dependabot Socket Firewall

on:
  pull_request:
    branches: [main]

jobs:
  socket-check:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # sfw doesn't support Poetry directly (only pip/uv, npm/yarn/pnpm, cargo) —
      # export the PR's resolved lock file to requirements.txt so "sfw pip install"
      # sees the exact dependency set Dependabot is proposing.
      - name: Install poetry and export requirements
        run: |
          pip install --no-cache-dir poetry==1.8.4 poetry-plugin-export
          poetry export -f requirements.txt --output requirements.txt --without-hashes

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install with firewall
        id: install
        run: sfw pip install -r requirements.txt
        continue-on-error: true

      - name: Close PR if firewall blocked something
        if: steps.install.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr close ${{ github.event.pull_request.number }} \
            --comment "Socket Firewall blocked this dependency for malicious/suspicious behavior. Closed automatically."
